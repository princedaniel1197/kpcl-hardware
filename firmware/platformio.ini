; CRPMS bench rig firmware.
;
;   pio run -e tcp -t upload && pio device monitor     Modbus TCP over WiFi
;   pio run -e rtu -t upload && pio device monitor     Modbus RTU over RS-485
;
; Both builds serve the same register map (REGISTER_MAP.md). The tcp build needs
; src/secrets.h (copy src/secrets.h.example); the rtu build does not use WiFi.
[platformio]
default_envs = tcp

; Versions are pinned to exactly what was compiled on 2026-09-23 (both
; environments, no warnings from src/). A range would let a future release change
; what "it compiles" means.
[env]
platform  = espressif32 @ 7.1.3
board     = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
lib_deps =
    miq19/eModbus @ 1.7.4                   ; MIT. Registry name miq19/eModbus.
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 3.11.0
    ; The accelerometer (MPU-6050 or MPU-6500) is read through its registers.

[env:tcp]

[env:rtu]
build_flags = ${env.build_flags} -D CRPMS_MODBUS_RTU
